name: verifier

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest -q
          tests/test_dcp_bundle.py
          tests/test_dcp_facade.py
          tests/test_dcp_v2_smoke.py
          tests/test_public_release.py
      - run: python -m ruff check dcp tests/test_public_release.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist/*
      - run: python -m pip install dist/*.whl
      - name: Verify the installed wheel outside the source tree
        working-directory: /tmp
        run: |
          dcp verify "$GITHUB_WORKSPACE/examples/audits/sqlite-web" --json
          dcp verify "$GITHUB_WORKSPACE/examples/audits/virtual-catalyst" --json
          dcp verify "$GITHUB_WORKSPACE/examples/audits/sqlite-core" --json
          dcp verify "$GITHUB_WORKSPACE/examples/audits/device-calibration-core" --json

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip install --no-deps -e packages/dcp-harness
      - run: >-
          PYTHONPATH=.:packages/dcp-harness/src
          python -m pytest packages/dcp-harness/tests -q
      - run: python -m ruff check packages/dcp-harness/src packages/dcp-harness/tests scripts/check_harness_distribution.py
      - run: python -m build packages/dcp-harness
      - run: python -m twine check packages/dcp-harness/dist/*
      - run: python scripts/check_harness_distribution.py packages/dcp-harness/dist/*
      - run: dcp-harness --version
      - run: dcp-harness init /tmp/dcp-harness-example
